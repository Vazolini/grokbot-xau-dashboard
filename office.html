<style>

<script>
'use strict';
const OWNER='Vazolini',REPO='grokbot-xau-dashboard',BR='data',POLL=20000;
const Q=new URLSearchParams(location.search),DEMO=Q.get('demo');
const cv=document.getElementById('c'),g=cv.getContext('2d');const W=1600,H=1000;
function fit(){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=Math.round(r.width*d);cv.height=Math.round(r.width*10/16*d);g.setTransform(cv.width/W,0,0,cv.height/H,0,0)}
addEventListener('resize',fit);fit();
// ---------- dados (lógica igual à v1) ----------
let S=null,mode='trabalho',lastClosedId=null,journalUntil=0,fetchedAt=0,stLbl='';
async function j(u,o){const c=new AbortController(),t=setTimeout(()=>c.abort(),12000);try{const r=await fetch(u,{cache:'no-store',signal:c.signal,...o});if(!r.ok)throw new Error('HTTP '+r.status);return r}finally{clearTimeout(t)}}
async function load(){let d=null;
 if(Q.get('src')){try{d=await (await j(Q.get('src'))).json()}catch(e){}}
 if(!d){try{const sha=(await (await j(`https://api.github.com/repos/${OWNER}/${REPO}/commits/${BR}`,{headers:{Accept:'application/vnd.github.sha'}})).text()).trim();d=await (await j(`https://raw.githubusercontent.com/${OWNER}/${REPO}/${sha}/state.json`)).json()}catch(e){}}
 if(!d){try{d=await (await j(`https://raw.githubusercontent.com/${OWNER}/${REPO}/${BR}/state.json?t=${Date.now()}`)).json()}catch(e){}}
 if(!d&&DEMO)d={bal:10000,price:4113.4,open:[],closed:[],signals:[],agents:{}};
 if(d){if(DEMO)demo(d);S=d;fetchedAt=Date.now();derive()}else{setSt('sem dados','bad')}}
function demo(d){const n=Date.now();
 if(DEMO==='sinal')d.signals=[{setup:'PULLBACK_EMA',side:'LONG',status:'A AGUARDAR 5m'}];
 if(DEMO==='aberto')d.open=[{id:7,side:'LONG',entry:4110.2,sl:4104.5,tp:4121.6}];
 if(DEMO==='fechado')d.closed=[{id:9,r:1.85,pnl:92.5,closedAt:n-30000}];
 if(DEMO==='pausa')d.revisao=true;}
const f2=x=>(+x).toLocaleString('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2});
function setSt(t,c){const e=document.getElementById('st');e.textContent=t;e.className='pill '+(c||'');stLbl=t}
function derive(){const d=S;
 document.getElementById('px').textContent=d.price?f2(d.price):'—';
 document.getElementById('bal').textContent=d.bal!=null?f2(d.bal)+' $':'—';
 const up=d.updatedAt?new Date(d.updatedAt):null;
 document.getElementById('upd').textContent=up?'atualizado '+up.toLocaleTimeString('pt-PT',{timeZone:'Europe/Lisbon',hour:'2-digit',minute:'2-digit'}):'';
 const pause=d.cb||d.revisao||d.dayStop;const open=(d.open||[]).length;const c0=(d.closed||[])[0];
 const sig=(d.signals||[]).length>0;
 if(c0&&c0.closedAt&&Date.now()-c0.closedAt<15*60e3&&c0.id!==undefined){if(c0.id!==lastClosedId){lastClosedId=c0.id}journalUntil=c0.closedAt+15*60e3}
 const jr=Date.now()<journalUntil;
 mode=pause?'pausa':open?'aberto':jr?'fechado':sig?'reuniao':'trabalho';
 const lbl={pausa:['PAUSA — '+(d.cb?'circuit breaker':d.revisao?'revisão obrigatória':'stop diário'),'bad'],aberto:['Trade aberto ('+open+')','warn'],fechado:['Trade fechado','ok'],reuniao:['Ronda / sinal em análise','warn'],trabalho:['Sem sinal — a trabalhar','ok']}[mode];
 setSt(lbl[0],lbl[1]);plan();cards()}
function cards(){const ag=(S&&S.agents)||{};document.getElementById('cards').innerHTML=A.map(a=>`<div class="card"><h4><i style="background:${a.col}"></i>${a.n}</h4><p>${esc(a.fixed||(ag[a.n]&&ag[a.n].last)||'…')}</p></div>`).join('')}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// ---------- cena v2 ----------
const DESKS=[[360,480],[360,610],[360,740],[1240,480],[1240,610],[1240,740]];
const SPOTS={sofa:[[720,650],[800,690],[880,650]],rack:[[230,520],[230,700]],radar:[[1330,880-170]],screen:[[700,440],[900,440]]};
const MEET=[[800,540],[690,550],[910,550],[590,570],[1010,570]];
const DEF=[{n:'CHIEF-XAU',col:'#ef4444',acc:'hat',d:DESKS[3]},{n:'TECNICA',col:'#3b82f6',acc:'glasses',d:DESKS[0]},{n:'MACRO',col:'#22c55e',acc:'phones',d:DESKS[1]},{n:'RISK-XAU',col:'#f97316',acc:'cap',d:DESKS[4]},{n:'JOURNAL-XAU',col:'#ec4899',acc:'bow',d:DESKS[2]}];
const A=DEF.map((d,i)=>{const s=[d.d[0]+(d.d[0]<800?110:-110),d.d[1]];return{...d,i,seat:s,x:s[0],y:s[1],tx:s[0],ty:s[1],bub:'',bubT:0,ph:i*1.3,fixed:'',at:'desk'}});
function say(a,t,ms){a.bub=t;a.bubT=performance.now()+(ms||2600)}
const EMO={sofa:['💤','☕','😌'],rack:['🖥️','Servidor OK','⚙️'],radar:['📡','Radar limpo','🛰️'],screen:['📊','🚀','Olha a vela!'],desk:['📊','⌨️','🚀'],visit:['👋','Viste o RSI?','Tudo OK?']};
const pick=a=>a[Math.random()*a.length|0];
function moveTo(a,p,k){a.tx=p[0];a.ty=p[1];a.at=k}
function plan(){const d=S||{};A.forEach(a=>a.fixed='');
 if(mode==='reuniao'){A.forEach((a,i)=>moveTo(a,MEET[i],'meet'));const s=d.signals[0]||{};A[0].fixed='Sinal '+(s.side||'')+' '+(s.setup||'')+'?';A[1].fixed='📊 Técnica confirma…';A[3].fixed='Risco 0,5% OK';A[2].fixed='Sem notícias perto?'}
 else{A.forEach(a=>{if(a.at==='meet')moveTo(a,a.seat,'desk')});
  if(mode==='aberto'){const p=d.open[0];A[3].fixed=`${p.side} @${f2(p.entry)} SL ${f2(p.sl)} TP ${f2(p.tp)}`}
  else if(mode==='fechado'){const c=d.closed[0];A[4].fixed=`Fechado: ${c.r>=0?'+':''}${(+c.r).toFixed(2)}R`}
  else if(mode==='pausa'){A[0].fixed='PAUSA. Sem novas entradas. 💤'}}}
// a cada poucos segundos um muda de sítio
setInterval(()=>{if(mode==='reuniao')return;const a=pick(A);if(Math.hypot(a.tx-a.x,a.ty-a.y)>2)return;
 let k;if(a.at!=='desk'&&Math.random()<.5){moveTo(a,a.seat,'desk');return}
 const r=Math.random();if(r<.2){const o=pick(A.filter(b=>b!==a));moveTo(a,[o.x+(o.x<800?90:-90),o.y+10],'visit')}
 else{k=pick(Object.keys(SPOTS));const s=pick(SPOTS[k]);moveTo(a,[s[0]+Math.random()*30-15,s[1]],k)}},2200);
function step(a,dt){const dx=a.tx-a.x,dy=a.ty-a.y,dd=Math.hypot(dx,dy),s=dt*0.14;
 if(dd<1){if(a.moving){a.moving=false;if(!a.fixed&&Math.random()<.8)say(a,pick(EMO[a.at]||EMO.desk))}return}
 a.moving=true;if(dd<=s){a.x=a.tx;a.y=a.ty}else{a.x+=dx/dd*s;a.y+=dy/dd*s}}
function rr(x,y,w,h,r,c){g.fillStyle=c;g.beginPath();g.roundRect(x,y,w,h,r);g.fill()}
function txt(t,x,y,sz,c,al,wt){g.font=(wt||600)+' '+sz+'px system-ui,Segoe UI,Roboto,sans-serif';g.fillStyle=c;g.textAlign=al||'left';g.textBaseline='middle';g.fillText(t,x,y)}
function glow(c,b){g.shadowColor=c;g.shadowBlur=b}function noglow(){g.shadowBlur=0}
function fitT(t,w){if(g.measureText(t).width<=w)return t;while(t.length&&g.measureText(t+'…').width>w)t=t.slice(0,-1);return t+'…'}
function lisbon(){const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Lisbon',hour:'numeric',minute:'numeric',hour12:false}).formatToParts(new Date());const v=k=>+p.find(x=>x.type===k).value;return{h:v('hour')%24,m:v('minute')}}
function candles(){const c=(S&&S.candles)||[];if(c.length)return c.slice(-60);
 const o=[];let p=4110;for(let i=0;i<60;i++){const op=p;p+=Math.sin(i/5)*2+Math.cos(i*1.7)*1.5;o.push({o:op,c:p,h:Math.max(op,p)+1.2,l:Math.min(op,p)-1.2})}return o}
const CARD=i=>({x:30+i*312,y:14,w:296,h:84});
function topCards(){const ag=(S&&S.agents)||{};A.forEach((a,i)=>{const c=CARD(i);glow(a.col,12);rr(c.x,c.y,c.w,c.h,10,'#0b0e18');noglow();g.strokeStyle=a.col;g.lineWidth=2;g.beginPath();g.roundRect(c.x,c.y,c.w,c.h,10);g.stroke();
 g.fillStyle=a.col;g.beginPath();g.arc(c.x+20,c.y+20,7,0,7);g.fill();txt(a.n,c.x+34,c.y+20,16,'#fff','left',800);
 const on=ag[a.n]&&ag[a.n].on;txt(S?(on?'● ON':'○ OFF'):'',c.x+c.w-12,c.y+20,12,on?'#4ade80':'#64748b','right',700);
 const m=a.fixed||(ag[a.n]&&ag[a.n].last)||'…';g.font='500 14px system-ui,sans-serif';const ws=m.split(' ');let l1='',k=0;for(;k<ws.length;k++){const tt=(l1?l1+' ':'')+ws[k];if(g.measureText(tt).width>c.w-24)break;l1=tt}
 txt(l1,c.x+12,c.y+46,14,'#cbd5e1','left',500);g.font='500 14px system-ui,sans-serif';txt(fitT(ws.slice(k).join(' '),c.w-24),c.x+12,c.y+66,14,'#cbd5e1','left',500)})}
const SX=490,SY=150,SW=620,SH=230;
function circuits(t){A.forEach((a,i)=>{const c=CARD(i),ex=c.x+c.w/2,ey=c.y+c.h,sx=SX+60+i*(SW-120)/4,sy=SY-8,my=118+ (i%2)*12;
 const pts=[[sx,sy],[sx,my],[ex,my],[ex,ey]];g.strokeStyle=a.col;g.globalAlpha=.55;g.lineWidth=2;g.beginPath();pts.forEach((p,k)=>k?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.stroke();g.globalAlpha=1;
 let L=0;const seg=[];for(let k=1;k<4;k++){const d=Math.hypot(pts[k][0]-pts[k-1][0],pts[k][1]-pts[k-1][1]);seg.push(d);L+=d}
 for(let q=0;q<2;q++){let f=((t/2200+i*.21+q*.5)%1)*L,k=0;while(k<2&&f>seg[k]){f-=seg[k];k++}const u=Math.min(1,f/seg[k]);const px=pts[k][0]+(pts[k+1][0]-pts[k][0])*u,py=pts[k][1]+(pts[k+1][1]-pts[k][1])*u;
  glow(a.col,14);g.fillStyle='#fff';g.beginPath();g.arc(px,py,4,0,7);g.fill();noglow()}})}
function bigScreen(t){glow('#22d3ee',30);rr(SX-8,SY-8,SW+16,SH+16,10,'#05070c');noglow();rr(SX,SY,SW,SH,6,'#070b16');
 const cs=candles();let lo=1e9,hi=-1e9;cs.forEach(k=>{lo=Math.min(lo,k.l);hi=Math.max(hi,k.h)});const pd=(hi-lo)*.08||1;lo-=pd;hi+=pd;
 const x=SX+14,y=SY+34,w=SW-90,h=SH-48,bw=w/(cs.length-1),Y=v=>y+h-(v-lo)/(hi-lo)*h,sh=((t/60)%bw);
 g.save();g.beginPath();g.rect(x,y-4,w,h+8);g.clip();g.strokeStyle='#141b2e';g.lineWidth=1;for(let i=1;i<5;i++){g.beginPath();g.moveTo(x,y+h*i/5);g.lineTo(x+w,y+h*i/5);g.stroke()}
 cs.forEach((k,i)=>{const cx=x+i*bw+bw/2-sh,up=k.c>=k.o,col=up?'#22c55e':'#f43f5e';g.strokeStyle=col;g.lineWidth=1.5;g.beginPath();g.moveTo(cx,Y(k.h));g.lineTo(cx,Y(k.l));g.stroke();const a=Y(Math.max(k.o,k.c)),b=Y(Math.min(k.o,k.c));g.fillStyle=col;g.fillRect(cx-bw*.32,a,bw*.64,Math.max(1.5,b-a))});
 glow('#ff2bd6',10);g.strokeStyle='#ff2bd6';g.lineWidth=2.5;g.beginPath();cs.forEach((k,i)=>{if(i%3)return;const cx=x+i*bw+bw/2-sh,v=i%6?k.h:k.l;i?g.lineTo(cx,Y(v)):g.moveTo(cx,Y(v))});g.stroke();noglow();g.restore();
 txt(hi.toFixed(1),SX+SW-10,y+8,12,'#64748b','right',500);txt(lo.toFixed(1),SX+SW-10,y+h-8,12,'#64748b','right',500);
 if(S&&S.price){const py=Y(+S.price);if(py>y&&py<y+h){rr(SX+SW-74,py-11,66,22,4,'#ffd166');txt((+S.price).toFixed(2),SX+SW-41,py,13,'#111','center',800)}}
 // ticker
 rr(SX,SY,SW,26,[6,6,0,0],'#111827');g.save();g.beginPath();g.rect(SX+4,SY,SW-8,26);g.clip();const d=S||{};
 const tk=`XAU/USD ${d.price?f2(d.price):'—'}   ·   SALDO ${d.bal!=null?f2(d.bal)+' $':'—'}   ·   ESTADO: ${stLbl||'…'}   ·   15m · PAPER   ·   `;g.font='700 14px system-ui,sans-serif';const tw=g.measureText(tk).width,off=(t/25)%tw;for(let k=-1;k<3;k++)txt(tk,SX+10-off+k*tw,SY+13,14,'#fde68a','left',700);g.restore();
 // P&L / posição
 const pnl=d.pnlDay!=null?(+d.pnlDay):null,op=(d.open||[])[0];glow('#22d3ee',12);
 txt('P&L DESK: '+(pnl==null?'—':(pnl>=0?'+':'')+pnl.toFixed(2)+'%'),800,SY+SH+28,20,pnl<0?'#fb7185':'#4ade80','center',800);
 txt('POSIÇÃO: '+(op?`${op.side} @${f2(op.entry)}`:'nenhuma')+'   ·   '+(d.open||[]).length+'/2',800,SY+SH+54,16,'#22d3ee','center',700);noglow()}
function rack(x,y,t){rr(x,y,90,170,6,'#0e111b');g.strokeStyle='#272e45';g.lineWidth=2;g.strokeRect(x,y,90,170);for(let i=0;i<8;i++){rr(x+8,y+10+i*20,74,14,2,'#161a28');g.fillStyle=Math.sin(t/200+i*2.3+x)>0?'#22c55e':'#14532d';g.fillRect(x+14,y+15+i*20,6,4);g.fillStyle=Math.sin(t/330+i+x)>.4?'#22d3ee':'#0c4a6e';g.fillRect(x+24,y+15+i*20,6,4)}}
function radar(t){const x=1430,y=600,r=70;rr(x-r-14,y-r-14,2*r+28,2*r+52,12,'#0b0e18');g.strokeStyle='#14532d';g.lineWidth=1.5;for(let k=1;k<=3;k++){g.beginPath();g.arc(x,y,r*k/3,0,7);g.stroke()}
 g.beginPath();g.moveTo(x-r,y);g.lineTo(x+r,y);g.moveTo(x,y-r);g.lineTo(x,y+r);g.stroke();const an=t/700;
 for(let k=0;k<20;k++){g.globalAlpha=(1-k/20)*.35;g.fillStyle='#22c55e';g.beginPath();g.moveTo(x,y);g.arc(x,y,r,an-k*.05-.05,an-k*.05);g.fill()}g.globalAlpha=1;
 glow('#22c55e',10);g.strokeStyle='#4ade80';g.lineWidth=3;g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(an)*r,y+Math.sin(an)*r);g.stroke();noglow();
 const nx=(S&&S.calendar)?1:0;g.fillStyle='#fde047';g.beginPath();g.arc(x+30,y-25,4,0,7);g.fill();txt('RADAR MACRO',x,y+r+22,14,'#e5e7eb','center',800)}
function desk(x,y,t,i){const gc=i%2?'#22d3ee':'#22c55e';glow(gc,14);rr(x-55,y-62,110,58,5,'#05070c');noglow();rr(x-50,y-57,100,48,3,mode==='pausa'?'#2a0b0b':'#07111c');
 g.strokeStyle=gc;g.lineWidth=2;g.beginPath();for(let k=0;k<=18;k++){const v=Math.sin(t/800+k*.6+i)*8+Math.sin(k*1.9+i)*5;k?g.lineTo(x-46+k*5.2,y-33+v):g.moveTo(x-46,y-33+v)}g.stroke();
 g.fillStyle='#1b2030';g.beginPath();g.moveTo(x-90,y);g.lineTo(x+90,y);g.lineTo(x+110,y+34);g.lineTo(x-70,y+34);g.closePath();g.fill();g.fillStyle='#0f1220';g.fillRect(x-70,y+34,180,18);g.fillStyle='#2b3248';g.fillRect(x-30,y+10,60,8)}
function sofa(){const x=800,y=660;g.fillStyle='#1c2133';rr(x-150,y-40,300,36,12,'#1c2133');rr(x-150,y-40,40,130,12,'#1c2133');rr(x+110,y-40,40,130,12,'#1c2133');rr(x-110,y-4,220,40,8,'#262c43');rr(x-60,y+50,120,30,6,'#141826');txt('LOUNGE',x,y+65,11,'#64748b','center',700)}
function clockPost(){const L=lisbon(),hq=Q.get('hora');let hh=L.h,mm=L.m;if(hq!=null){const v=+hq;hh=Math.floor(v);mm=Math.round((v-hh)*60)}
 rr(1170,150,130,80,8,'#05070c');glow('#22c55e',12);txt(String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0'),1235,182,30,'#4ade80','center',800);noglow();txt('HORA LOCAL · LISBOA',1235,214,11,'#94a3b8','center',700);
 const R=[['0,5% / trade','#fde047'],['Máx 2 posições','#f9a8d4'],['-3% dia STOP','#86efac'],['Sem notícias','#93c5fd']];rr(1320,140,250,190,6,'#0f1320');txt('REGRAS DO DESK',1445,156,12,'#e5e7eb','center',800);
 R.forEach(([s,c],i)=>{const px=1332+(i%2)*120,py=172+(i/2|0)*76;rr(px,py,108,66,2,c);txt(s,px+54,py+33,13,'#111','center',800)});return hh+mm/60}
function plant(x,y,s){rr(x-14*s,y,28*s,26*s,5,'#1f2433');g.fillStyle='#16a34a';for(let i=0;i<7;i++){g.save();g.translate(x,y);g.rotate((i-3)*.42);g.beginPath();g.ellipse(0,-22*s,6*s,22*s,0,0,7);g.fill();g.restore()}}
function bottom(t){const d=S||{};const x=30,y=850,w=740,h=130;rr(x,y,w,h,10,'#0b0e18');g.strokeStyle='#14532d';g.lineWidth=2;g.beginPath();g.roundRect(x,y,w,h,10);g.stroke();
